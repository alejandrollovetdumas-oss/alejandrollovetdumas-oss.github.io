<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llovet Art - Arte Florentino en Hoja de Oro</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #fcfbfa;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 40px 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin: 20px;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 5px;
            color: #b59410; /* Dorado elegante */
            font-weight: 400;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 1.3rem;
            color: #555;
            font-weight: 300;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .art-image {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }
        .contact-info {
            font-size: 1.1rem;
            color: #444;
            margin-bottom: 25px;
        }
        .contact-info a {
            color: #b59410;
            text-decoration: none;
            font-weight: bold;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
        .whatsapp-btn {
            display: inline-block;
            background-color: #25D366; /* Verde oficial WhatsApp */
            color: white;
            padding: 14px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            transition: all 0.3s ease;
        }
        .whatsapp-btn:hover {
            background-color: #20ba5a;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Llovet Art</h1>
        <div class="subtitle">Arte Florentino en Hoja de Oro</div>
        
        <!-- IMAGEN DE LA OBRA -->
        <!-- Nota: Reemplaza 'obra.jpeg' por el nombre real de tu imagen cuando la subas -->
        <img src="obra.jpeg" alt="Obra de Arte Florentino - Llovet Art" class="art-image">

                <!-- CONTACTO DE CORREO -->
        <div class="contact-info">
            Contacto: <a href="mailto:maria.abascal@llovetart.com.mx">maria.abascal@llovetart.com.mx</a>
        </div>

        <!-- BOTÓN DE WHATSAPP CON EL NÚMERO ARMADO POR PARTES -->
        <a href="https://wa.me" onclick="this.href='https://wa.me' + '525554372401' + '?text=Hola'" class="whatsapp-btn" target="_blank">
            Contactar por WhatsApp
        </a>

    </div>
</body>
</html>
